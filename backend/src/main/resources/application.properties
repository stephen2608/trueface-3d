server.port=8080

# Spring Boot 3.x Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Application Metadata
spring.application.name=trueface-3d-backend

# Database Config (Embedded H2 for zero-configuration out-of-the-box, easily switchable to MySQL)
spring.datasource.url=jdbc:h2:mem:trueface3ddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console for Inspecting 3D Telemetry Tables
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# WebSocket Ingestion Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging configuration
logging.level.com.trueface3d=INFO
logging.level.org.springframework.web.socket=INFO
